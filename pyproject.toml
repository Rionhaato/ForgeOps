[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgeops"
version = "0.1.0"
description = "Deterministic project-state, testing, and safety toolkit for Claude Code and Codex."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Joshua Santiago" }]
dependencies = []

[project.scripts]
forgeops = "forgeops.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["forgeops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
